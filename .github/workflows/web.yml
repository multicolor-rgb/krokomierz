name: Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build app
        working-directory: mobile
        run: |
          npm ci
          npm run build

      - name: Build landing
        working-directory: landing
        run: |
          npm ci
          npm run build

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: krokomierz-pwa
          path: mobile/dist

      - name: Upload landing
        uses: actions/upload-artifact@v4
        with:
          name: krokomierz-landing
          path: landing/dist
