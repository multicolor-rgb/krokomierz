name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOLS="$(dirname "$(find "$SDK/cmdline-tools" -name sdkmanager | head -1)")"
          echo "$TOOLS" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using SDK at $SDK, tools at $TOOLS"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web assets
        working-directory: mobile
        run: npm run build:native

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Configure signing
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK & AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare artifacts
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/krokomierz-$VERSION.apk"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "artifacts/krokomierz-$VERSION.aab"
          cp "artifacts/krokomierz-$VERSION.apk" "artifacts/krokomierz-latest.apk"
          cp "artifacts/krokomierz-$VERSION.aab" "artifacts/krokomierz-latest.aab"
          cd artifacts
          VERSION_CODE=$(grep -oP 'versionCode \K[0-9]+' ../mobile/android/app/build.gradle | head -1)
          sha256sum "krokomierz-$VERSION.apk" > "krokomierz-$VERSION.apk.sha256"
          sha256sum "krokomierz-latest.apk" > "krokomierz-latest.apk.sha256"
          SIZE=$(stat -c%s "krokomierz-$VERSION.apk")
          SHA=$(sha256sum "krokomierz-$VERSION.apk" | awk '{print $1}')
          cat > version.json <<JSON
          {
            "version": "$VERSION",
            "versionCode": ${VERSION_CODE:-2},
            "url": "https://github.com/multicolor-rgb/krokomierz/releases/latest/download/krokomierz-latest.apk",
            "size": $SIZE,
            "sha256": "$SHA",
            "date": "$(date -u +%Y-%m-%d)"
          }
          JSON

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krokomierz-android
          path: artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
